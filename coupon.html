<!DOCTYPE html>
<html>
    <head>
        <style>
            @media (max-width: 767px) {
                .flex {
                    padding-left: 16px;
                }
            }
            
            @media (min-width: 768px) {
                .flex {
                    padding-left: 0;
                }
            }
                
            @media (min-width: 1024px) {
                .flex {
                    padding-left: 0;
                }
            }
            
            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translate(-50%, 20px);
                }
                
                to {
                    opacity: 1;
                    transform: translate(-50%, 0);
                }
            }

            .copy-toast {
                position: fixed;
                bottom: 80px;
                left: 50%;
                transform: translateX(-50%);
                background-color: rgb(225, 110, 80);
                color: white;
                padding: 12px 16px;
                border-radius: 8px;
                font-size: 14px;
                z-index: 1000;
                max-width: calc(-32px + 100vw);
                min-width: 200px;
                width: auto;
                text-align: center;
                box-shadow: rgba(0, 0, 0, 0.15) 0px 4px 12px;
                animation: 0.3s ease-out 0s 1 normal none running slideIn;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            
            #aakasi-coupon-strip .coupon-card {
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="flex" id="aakasi-coupon-strip" style="gap: 10px; display: flex; overflow: scroll; margin-bottom: 1.5rem; flex-direction: row; scrollbar-width: none;">
            <div class="coupon-card" data-coupon="NEW5" style="height: 92px; min-width: 300px; background-color: #f7eee8; padding: 0.75rem; padding-top: 0.5rem; padding-bottom: 0.5rem; flex-direction: column; justify-content: space-between; white-space: nowrap;">
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <div style="height: 24px; position: relative;">
                                <img alt="offers" loading="lazy" width="24" height="24" decoding="async" data-nimg="1" src="https://www.aakasi.com/wp-content/uploads/2026/08/offers.gif" style="color: transparent;">
                            </div>
                            <h2 style="line-height: 18px; margin-top: 0; margin-bottom: 0; font-family: NewHeroTRIAL-Bold; font-size: 12px;">NEW5</h2>
                        </div>
                        <span class="copy-icon" style="cursor: pointer;" onclick="copyToClipboard(this)" data-copy-text="NEW5">
                            <svg width="16" height="16" viewBox="0 0 12 12" fill="none">
                                <path d="M8 1.5H2V8" stroke="#000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M4 3.5H10V9.5C10 9.76522 9.89464 10.0196 9.70711 10.2071C9.51957 10.3946 9.26522 10.5 9 10.5H5C4.73478 10.5 4.48043 10.3946 4.29289 10.2071C4.10536 10.0196 4 9.76522 4 9.5V3.5Z" stroke="#000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </span>
                    </div>
                </div>
                <p style="line-height: 18px; margin-bottom: 0; padding-top: 0.5rem; padding-bottom: 0.5rem; white-space: normal; max-width: 280px; font-family: NewHeroTRIAL-Light; font-size: 12px;">Enjoy 5% off on your first order.</p>
            </div>
                
            <div class="coupon-card" data-coupon="AAKASI10" style="height: 92px; min-width: 300px; background-color: #f7eee8; padding: 0.75rem; padding-top: 0.5rem; padding-bottom: 0.5rem; flex-direction: column; justify-content: space-between; white-space: nowrap;">
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <div style="height: 24px; position: relative;">
                                <img alt="offers" loading="lazy" width="24" height="24" decoding="async" data-nimg="1" src="https://www.aakasi.com/wp-content/uploads/2026/08/offers.gif" style="color: transparent;">
                                </div>
                                <h2 style="line-height: 18px; margin-top: 0; margin-bottom: 0; font-family: NewHeroTRIAL-Bold; font-size: 12px;">AAKASI10</h2>
                                </div>
                                <span class="copy-icon" style="cursor: pointer;" onclick="copyToClipboard(this)" data-copy-text="AAKASI10">
                                    <svg width="16" height="16" viewBox="0 0 12 12" fill="none">
                                        <path d="M8 1.5H2V8" stroke="#000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"></path>
                                        <path d="M4 3.5H10V9.5C10 9.76522 9.89464 10.0196 9.70711 10.2071C9.51957 10.3946 9.26522 10.5 9 10.5H5C4.73478 10.5 4.48043 10.3946 4.29289 10.2071C4.10536 10.0196 4 9.76522 4 9.5V3.5Z" stroke="#000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"></path>
                                    </svg>
                                </span>
                            </div>
                        </div>
                        <p style="line-height: 18px; margin-bottom: 0; padding-top: 0.5rem; padding-bottom: 0.5rem; white-space: normal; max-width: 280px; font-family: NewHeroTRIAL-Light; font-size: 12px;">Enjoy 10% off on your first order.</p>
            </div>
        </div>
        <script>
            (function () {
                var AJAX_URL = "/wp-admin/admin-ajax.php?action=aakasi_get_hidden_coupons";
                
                function refreshAakasiCoupons() {
                    fetch(AJAX_URL, { credentials: 'same-origin', cache: 'no-store' })
                        .then(function (res) {
                          return res.json();
                        })
                        .then(function (hidden) {
                            var strip = document.getElementById('aakasi-coupon-strip');
                            if (!strip)
                              return;
                            strip.querySelectorAll('.coupon-card')
                              .forEach(function (card) {
                                var code = card.getAttribute('data-coupon');
                                card.style.display = (hidden.indexOf(code) === -1)
                                  ? 'flex'
                                  : 'none';
                              });
                        })
                        .catch(function () {
                            var strip = document.getElementById('aakasi-coupon-strip');
                            if (!strip)
                              return;
                            strip.querySelectorAll('.coupon-card')
                                .forEach(function (card) {
                                  card.style.display = 'flex';
                                });
                        });
                }

                document.addEventListener('DOMContentLoaded', refreshAakasiCoupons);
            
                if (window.jQuery) {
                    jQuery(document.body).on('applied_coupon removed_coupon updated_cart_totals', refreshAakasiCoupons);
                }
            })();

            function copyToClipboard(el) {
                var text = el.getAttribute('data-copy-text') || window.location.href;
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text)
                      .then(showCopyToast)
                      .catch(function () {
                        fallbackCopy(text);
                      });
                } else {
                    fallbackCopy(text);
                }
            }
            
            function fallbackCopy(text) {
                var textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                try {
                  document.execCommand('copy');
                } catch (err) {
                  console.error('Copy failed', err);
                }
                document.body.removeChild(textarea);
                showCopyToast();
            }
            
            function showCopyToast() {
                var existing = document.querySelector('.copy-toast');
                if (existing)
                  existing.remove();
                var toast = document.createElement('div');
                toast.className = 'copy-toast';
                toast.textContent = 'Coupon code copied!';
                document.body.appendChild(toast);
                setTimeout(function () {
                  toast.remove();
                }, 2000);
            }
        </script>
    </body>
</html>
